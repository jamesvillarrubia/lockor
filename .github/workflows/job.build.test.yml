###############################################################################
# TEST JOB
###############################################################################
#
# This job runs the complete test suite including unit, integration, and e2e tests.
# It ensures all functionality works correctly before deployment.
#
# USAGE:
#   - Run automatically when extension files change
#   - Can be triggered manually via workflow_dispatch
#   - Fails the pipeline if any tests fail
#
# CONFIGURATION:
#   - Node.js version: 20
#   - Test runner: Vitest
#   - Coverage: @vitest/coverage-v8
#
###############################################################################

name: "Test Suite"

on:
  workflow_call:
  workflow_dispatch:
  # Removed push and pull_request triggers to avoid duplication with main pipeline
  # Tests are now only run through the main CI/CD pipeline (pipe.yml)

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run Unit Tests
        run: pnpm test:run test/unit/

      - name: Run Integration Tests
        run: pnpm test:run test/integration/

      - name: Run E2E Tests
        run: pnpm test:e2e:run

      - name: Run Test Coverage (Unit + Integration only)
        run: pnpm test:coverage:unit

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Try to read coverage summary
            try {
              const coveragePath = path.join('coverage', 'lcov-report', 'index.html');
              if (fs.existsSync(coveragePath)) {
                console.log('Coverage report generated successfully');
              } else {
                console.log('Coverage report not found');
              }
            } catch (error) {
              console.log('Could not read coverage report:', error.message);
            }
